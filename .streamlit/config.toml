[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
# app.py catches failures and re-renders them as user-facing messages, so the
# raw traceback is redundant on a public deployment.
showErrorDetails = "none"
toolbarMode = "minimal"

# Base tokens only. Streamlit's own widgets read these; everything else — the
# aurora backdrop, the metric grid, motion — lives in ui/theme.py so there is a
# single source of truth for the palette. Keep the two in step.
[theme]
base = "dark"
primaryColor = "#A3E635"
backgroundColor = "#0F1115"
secondaryBackgroundColor = "#161A21"
textColor = "#E8E8E5"
linkColor = "#A3E635"
borderColor = "#242A34"
codeBackgroundColor = "#161A21"
font = "Be Vietnam Pro, ui-sans-serif, system-ui, sans-serif"
codeFont = "Google Sans Code, ui-monospace, SFMono-Regular, Menlo, monospace"
baseRadius = "0.5rem"
