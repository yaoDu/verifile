[project]
# The distribution is named for the product; the import package stays
# `filing_change_analyst` so the rename does not churn every import in the tree.
name = "verifile"
version = "0.1.0"
description = "Verifile — evidence-first SEC filing change analysis for fundamental equity research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "streamlit>=1.60",  # segmented_control, popover, width="stretch", newer theme keys
    "starlette<1.4",  # 1.4 broke streamlit's GZip middleware subclass; see requirements.txt
    "anthropic>=0.40",  # Messages API client; also used against DeepSeek
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filing_change_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: test requires live SEC network access (deselect with '-m \"not network\"')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: long lines are allowed in prose-heavy strings (user-facing messages).
# B008: Pydantic Field(...) defaults are the documented idiom.
# SIM905: a space-separated stopword string is more readable than a 60-item list.
ignore = ["E501", "B008", "SIM905"]
