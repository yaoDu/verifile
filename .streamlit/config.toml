[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
# app.py catches failures and re-renders them as user-facing messages, so the
# raw traceback is redundant on a public deployment.
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f5f9"
textColor = "#1a1a1a"
